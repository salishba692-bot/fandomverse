<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="fandomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e36"/>
      <stop offset="50%" stop-color="#2c1a59"/>
      <stop offset="100%" stop-color="#0a081e"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="75%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#fd79a8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fd79a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a29bfe" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#fandomGrad)"/>
  <circle cx="240" cy="160" r="260" fill="url(#nebula1)"/>
  <circle cx="600" cy="240" r="220" fill="url(#nebula2)"/>
  <!-- Perspective Grid lines -->
  <g stroke="url(#gridGrad)" stroke-width="1.5">
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="0" y1="305" x2="800" y2="305"/>
    <line x1="400" y1="280" x2="100" y2="400"/>
    <line x1="400" y1="280" x2="250" y2="400"/>
    <line x1="400" y1="280" x2="400" y2="400"/>
    <line x1="400" y1="280" x2="550" y2="400"/>
    <line x1="400" y1="280" x2="700" y2="400"/>
  </g>
  <!-- Constellation stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="2" opacity="0.9"/>
    <circle cx="180" cy="140" r="1.5" opacity="0.7"/>
    <circle cx="280" cy="70" r="2.5" opacity="0.8"/>
    <circle cx="340" cy="110" r="1.5" opacity="0.6"/>
    <circle cx="480" cy="90" r="2" opacity="0.85"/>
    <circle cx="560" cy="60" r="1.5" opacity="0.7"/>
    <circle cx="660" cy="130" r="2.5" opacity="0.9"/>
    <circle cx="720" cy="75" r="1.5" opacity="0.8"/>
    <circle cx="410" cy="170" r="2" opacity="0.7"/>
  </g>
  <polyline points="120,80 180,140 280,70 340,110 480,90 560,60 660,130" fill="none" stroke="#a29bfe" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <!-- Center emblem -->
  <circle cx="400" cy="180" r="64" fill="#0c0a22" stroke="#6c5ce7" stroke-width="3" opacity="0.85"/>
  <polygon points="400,135 413,165 445,168 421,189 428,221 400,204 372,221 379,189 355,168 387,165" fill="#fdcb6e"/>
</svg>